<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            margin: 0 auto;
        }

        #formContainer{
            max-width: 500px;
            margin: 10px auto;
            border: 10px solid #0d2e7c;
            border-radius: 20px;
            background: white;
            overflow: hidden;
        }

        img {
            max-width: 100%;
        }

        #jesus{
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr;
            text-align: center;
            max-height: 215px;
            overflow: hidden;
        }

        #closeBtn {
            position: absolute;
            margin-top: 10px;
            margin-left: 10px;
        }

        #jesus img{
            grid-column: 1/2;
            grid-row: 1/5;
        }

        #jesus h1{
            color: white;
            font-size: 2.5em;
            grid-column: 1/2;
            grid-row: 3/4;
            text-shadow: 2px 2px 1px black;
        }

        #jesus h2{
            color: white;
            font-size: 2em;
            grid-column: 1/2;
            grid-row: 4/5;
            text-shadow: 2px 2px 1px black;
        }

        #scriptures{
            margin-top: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            column-gap: 3px;
        }

        h3{
            text-align: center;
            font-size: 1.5em;
            margin: 10px;
        }

        form{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1em;
            padding: 1em;
        }

        label, input{
        }

        #male, #female{
            margin: 0px;
        }

        section{
            grid-column: 1/3;
            justify-self: center;
            margin-bottom: 10px;
        }

    </style>




</head>

<body>
    <div id="formContainer">
        <button type="button" id="closeBtn">X</button>
        <div id="jesus">
            <img src="images/jesus_feeds_5000.jpeg" alt="jesus_feeds_5000">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="scriptures">
            <img src="images/old_testament.webp" alt="old_testament">
            <img src="images/new_testament.webp" alt="new_testament">
            <img src="images/book_of_mormon.webp" alt="book_of_mormon">
            <img src="images/doctrine_and_covenants.webp" alt="doctrine_and_covenants">
            <img src="images/pearl_of_great_price.webp" alt="pearl_of_great_price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
